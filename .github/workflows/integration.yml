name: OneCX integration matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    uses: doasdk/onecx-playwright/.github/workflows/integration.yml@v0.0.3
    with:
      config-path: integration/integration.config.json
      orchestrator-image: ${{ vars.ORCHESTRATOR_IMAGE }}
      e2e-image: ${{ vars.E2E_IMAGE }}
      max-parallel: 2
    secrets:
      ENVIRONMENTS_JSON: ${{ secrets.ENVIRONMENTS_JSON }}
      TEST_DATA_JSON: ${{ secrets.TEST_DATA_JSON }}
